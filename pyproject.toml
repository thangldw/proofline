[project]
name = "proofline-evidence"
version = "2.1.2"
description = "Evidence-first engineering decision memory"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Thang Luu"}]
keywords = ["engineering", "knowledge", "provenance", "retrieval", "local-first"]
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "pillow>=13,<14",
  "pydantic>=2.9,<3",
  "python-pptx>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.urls]
Homepage = "https://github.com/thangldw/proofline"
Repository = "https://github.com/thangldw/proofline.git"
Issues = "https://github.com/thangldw/proofline/issues"
Changelog = "https://github.com/thangldw/proofline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx2>=2,<3",
  "hypothesis>=6,<7",
  "mypy>=2,<3",
  "jsonschema>=4.23,<5",
  "pip>=26.2,<27",
  "pip-audit>=2.10.1,<3",
  "pyinstaller>=6.21,<7",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.8,<1",
  "setuptools>=83,<85",
  "twine>=7,<8",
]

[project.scripts]
proofline = "proofline.runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/proofline"]
exclude = [
  "**/*.db",
  "**/*.key",
  "**/*.pem",
  "**/*.pyc",
  "**/__pycache__",
]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/apps/api/proofline",
  "/spec",
]
exclude = [
  "/.hypothesis",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/.worktrees",
  "/apps/web/dist",
  "/apps/desktop/src-tauri/binaries",
  "/apps/desktop/src-tauri/gen",
  "/apps/desktop/src-tauri/target",
  "/build",
  "/node_modules",
  "**/__pycache__",
  "**/node_modules",
  "**/*.db",
  "**/*.key",
  "**/*.pyc",
  "**/*.tsbuildinfo",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.coverage.run]
source = ["apps/api/proofline"]

[tool.coverage.report]
fail_under = 88
show_missing = false
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["apps/api/proofline"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Ratchet: these modules still carry pre-existing type errors (baseline of 2.1.0). Do not add
# modules to this list; remove a module once its errors are fixed. New modules are checked.
[[tool.mypy.overrides]]
module = [
  "proofline.api",
  "proofline.backup",
  "proofline.cli",
  "proofline.decision_reviews",
  "proofline.evaluation",
  "proofline.evidence_packages",
  "proofline.extraction",
  "proofline.folder_scanning",
  "proofline.git_ingestion",
  "proofline.grounding",
  "proofline.ingestion",
  "proofline.integrity",
  "proofline.model_gateway",
  "proofline.pilot_simulation",
  "proofline.portability",
  "proofline.portable_import",
  "proofline.real_model_evaluation",
  "proofline.server",
  "proofline.studio",
]
ignore_errors = true
