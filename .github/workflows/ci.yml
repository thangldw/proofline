name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-test-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: make test
      - run: make check
      - run: make audit
      - run: npm run test:e2e

  web-test-build-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run build:web
      - run: npm audit --omit=dev --audit-level=high

  package-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: make verify-package-conformance
      - run: proofline demo stale-decision --output-dir /tmp/proofline-ci-demo
      - run: proofline verify-package /tmp/proofline-ci-demo/evidence.zip
      - run: proofline verify-review-receipt /tmp/proofline-ci-demo/decision-review.json
      - run: proofline generate-attestation-key --private-key /tmp/proofline-ci-key.pem --public-key /tmp/proofline-ci-key.pub.pem
      - run: proofline attest --package /tmp/proofline-ci-demo/evidence.zip --review-receipt /tmp/proofline-ci-demo/decision-review.json --private-key /tmp/proofline-ci-key.pem --output /tmp/proofline-ci-attestation.json
      - run: proofline verify-attestation /tmp/proofline-ci-attestation.json --public-key /tmp/proofline-ci-key.pub.pem --package /tmp/proofline-ci-demo/evidence.zip --review-receipt /tmp/proofline-ci-demo/decision-review.json

  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m build --outdir dist
      - run: python scripts/verify_release_artifacts.py dist/*.whl dist/*.tar.gz
      - run: python scripts/qualify_python_artifact.py --artifact dist/proofline-2.0.0-py3-none-any.whl --expected-version 2.0.0
      - run: python scripts/qualify_python_artifact.py --artifact dist/proofline-2.0.0.tar.gz --expected-version 2.0.0

  decision-health-sarif:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: mkdir -p artifacts && PROOFLINE_HOME="$RUNNER_TEMP/proofline" proofline seed
      - run: PROOFLINE_HOME="$RUNNER_TEMP/proofline" proofline check-decisions --format sarif --output artifacts/decision-health.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: decision-health-sarif
          path: artifacts/decision-health.sarif
          if-no-files-found: error

  decision-impact-sarif:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: mkdir -p artifacts && PROOFLINE_HOME="$RUNNER_TEMP/proofline" proofline seed
      - run: PROOFLINE_HOME="$RUNNER_TEMP/proofline" proofline check-impacts --format sarif --output artifacts/decision-impact.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: decision-impact-sarif
          path: artifacts/decision-impact.sarif
          if-no-files-found: error
