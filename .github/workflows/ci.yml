name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-test-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
      - run: python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make test
      - run: make check
      - run: make audit
      - run: npm run test:e2e

  web-test-build-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run build:web
      - run: npm audit --omit=dev --audit-level=high

  package-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'
      - run: make verify-package-conformance
      - run: .venv/bin/proofline demo stale-decision --output-dir /tmp/proofline-ci-demo
      - run: .venv/bin/proofline verify-package /tmp/proofline-ci-demo/evidence.zip
      - run: .venv/bin/proofline verify-review-receipt /tmp/proofline-ci-demo/decision-review.json
      - run: .venv/bin/proofline generate-attestation-key --private-key /tmp/proofline-ci-key.pem --public-key /tmp/proofline-ci-key.pub.pem
      - run: .venv/bin/proofline attest --package /tmp/proofline-ci-demo/evidence.zip --review-receipt /tmp/proofline-ci-demo/decision-review.json --private-key /tmp/proofline-ci-key.pem --output /tmp/proofline-ci-attestation.json
      - run: .venv/bin/proofline verify-attestation /tmp/proofline-ci-attestation.json --public-key /tmp/proofline-ci-key.pub.pem --package /tmp/proofline-ci-demo/evidence.zip --review-receipt /tmp/proofline-ci-demo/decision-review.json

  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'
      - run: .venv/bin/python -m build --outdir dist
      - run: .venv/bin/python scripts/verify_release_artifacts.py dist/*.whl dist/*.tar.gz
      - run: .venv/bin/python scripts/qualify_python_artifact.py --artifact dist/proofline_evidence-2.0.1-py3-none-any.whl --expected-version 2.0.1
      - run: .venv/bin/python scripts/qualify_python_artifact.py --artifact dist/proofline_evidence-2.0.1.tar.gz --expected-version 2.0.1

  decision-health-sarif:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'
      - run: mkdir -p artifacts && PROOFLINE_HOME="$RUNNER_TEMP/proofline" .venv/bin/proofline seed
      - run: PROOFLINE_HOME="$RUNNER_TEMP/proofline" .venv/bin/proofline check-decisions --format sarif --output artifacts/decision-health.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: decision-health-sarif
          path: artifacts/decision-health.sarif
          if-no-files-found: error

  decision-impact-sarif:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'
      - run: mkdir -p artifacts && PROOFLINE_HOME="$RUNNER_TEMP/proofline" .venv/bin/proofline seed
      - run: PROOFLINE_HOME="$RUNNER_TEMP/proofline" .venv/bin/proofline check-impacts --format sarif --output artifacts/decision-impact.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: decision-impact-sarif
          path: artifacts/decision-impact.sarif
          if-no-files-found: error
