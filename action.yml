name: Proofline decision check
description: Fail a pull request when an approved decision's cited evidence changed in the documents.
author: Thang Luu

inputs:
  path:
    description: Folder of Markdown/text documents to index, relative to the workspace.
    default: "."
  snapshot:
    description: Portable JSON snapshot (proofline export) holding the approved decisions.
    required: true
  uri-root:
    description: file:// URI the folder had when the snapshot was created; keeps source identity stable across machines.
    required: true
  policy:
    description: Optional path to a proofline.toml decision policy.
    default: ""
  proofline-version:
    description: Exact proofline-evidence version to install from PyPI.
    default: "2.9.0"
  sarif-output:
    description: Where to write the SARIF report.
    default: proofline-decision-health.sarif
  check-expiry:
    description: Also fail when an approved decision is past its Review by date.
    default: "false"
  code-refs:
    description: Space-separated paths to scan for proofline-decision markers in code. Empty skips the scan.
    default: ""
  enforce:
    description: Also fail when code violates an `Enforce:` rule of an approved decision (check-enforcement). Needs proofline-version 2.10.0 or newer.
    default: "false"
  code-context:
    description: On pull requests, append the approved decisions touched by the change (code references, edited documents, applicable rules) to the job summary. Informational; needs fetch-depth 0 and proofline-version 2.10.0 or newer.
    default: "false"
  comment:
    description: Post or update one content-free summary comment on the pull request. Needs the pull-requests write permission.
    default: "false"
  github-token:
    description: Token used only when `comment` is true.
    default: ${{ github.token }}

outputs:
  sarif-file:
    description: Path to the SARIF report.
    value: ${{ steps.check.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Install Proofline
      shell: bash
      run: python -m pip install --disable-pip-version-check "proofline-evidence==${{ inputs.proofline-version }}"
    - name: Check approved decisions
      id: check
      shell: bash
      env:
        PROOFLINE_HOME: ${{ runner.temp }}/proofline-home
        PL_PATH: ${{ inputs.path }}
        PL_SNAPSHOT: ${{ inputs.snapshot }}
        PL_URI_ROOT: ${{ inputs.uri-root }}
        PL_POLICY: ${{ inputs.policy }}
        PL_SARIF: ${{ inputs.sarif-output }}
        PL_EXPIRY: ${{ inputs.check-expiry }}
        PL_CODE_REFS: ${{ inputs.code-refs }}
        PL_ENFORCE: ${{ inputs.enforce }}
        PL_CONTEXT: ${{ inputs.code-context }}
        PL_BASE_REF: ${{ github.base_ref }}
      run: |
        set -uo pipefail
        proofline import "$PL_SNAPSHOT"
        proofline sync "$PL_PATH" --uri-root "$PL_URI_ROOT"
        policy_args=()
        if [ -n "$PL_POLICY" ]; then policy_args=(--policy "$PL_POLICY"); fi
        proofline check-decisions --format sarif --output "$PL_SARIF" "${policy_args[@]}"
        echo "sarif-file=$PL_SARIF" >> "$GITHUB_OUTPUT"
        proofline check-decisions --format json --output "$RUNNER_TEMP/pl-decisions.json" "${policy_args[@]}"
        proofline check-impacts --format json --output "$RUNNER_TEMP/pl-impacts.json"
        status=0
        proofline check-decisions "${policy_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "${PIPESTATUS[0]}" -ne 0 ]; then status=1; fi
        if [ "$PL_EXPIRY" = "true" ]; then
          proofline check-expiry | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then status=1; fi
        fi
        if [ -n "$PL_CODE_REFS" ]; then
          read -r -a ref_paths <<< "$PL_CODE_REFS"
          proofline check-code-refs "${ref_paths[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then status=1; fi
        fi
        if [ "$PL_ENFORCE" = "true" ]; then
          proofline check-enforcement | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then status=1; fi
        fi
        if [ "$PL_CONTEXT" = "true" ] && [ -n "$PL_BASE_REF" ]; then
          proofline code-context --base "origin/$PL_BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY" || true
        fi
        exit "$status"
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python "${{ github.action_path }}/scripts/pr_gate_comment.py" \
          --decisions "$RUNNER_TEMP/pl-decisions.json" --impacts "$RUNNER_TEMP/pl-impacts.json"
